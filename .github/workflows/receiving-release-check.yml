name: Receiving Release Checks
on:
  push:
    branches: ['receiving-release-build']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: JavaScript syntax
        run: |
          node --check ui.js
          node --check js/receiving-release.js
          node --check js/handheld-runtime.js
          node --check js/master-gtin.js
          node --check js/orders.js
          node --check js/reports.js
          node --check js/state.js
          node --check cloud-workspace.js
      - run: npm run build
